<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Exporter</title>
<style>
  :root{color-scheme:light;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:#18382d;background:#f3f6f2}*{box-sizing:border-box}body{width:380px;margin:0;padding:20px}header{padding:2px 2px 16px}.eyebrow{margin:0 0 8px;color:#187653;font-size:10px;font-weight:750;letter-spacing:.13em}h1{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.04em}.intro{margin:8px 0 0;color:#5d6d64;font-size:13px}.actions{display:grid;gap:9px}.action{display:grid;gap:3px;width:100%;min-height:76px;padding:12px 14px;border:1px solid #d8e1da;border-radius:10px;background:#fff;color:#18382d;text-align:left;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}.action:hover{transform:translateY(-1px);border-color:#80aa91}.action:active{transform:translateY(0)}.action:focus-visible,#download:focus-visible{outline:3px solid #79b89a;outline-offset:2px}.action.primary{border-color:#145c42;background:#145c42;color:#fff}.action.primary:hover{background:#104d37}.step{font-size:10px;font-weight:750;letter-spacing:.1em;opacity:.78}.action strong{font-size:14px}.hint{font-size:12px;opacity:.76}.action:disabled,#download:disabled{opacity:.55;cursor:wait}#status{min-height:38px;margin:12px 1px 8px;color:#4c6256;font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0}.metric{padding:10px;border:1px solid #dfe6df;border-radius:8px;background:#fff}.metric strong{display:block;font-size:20px;line-height:1.1}.metric span{display:block;margin-top:4px;color:#64736a;font-size:10px}.coverage{margin:8px 1px;color:#617067;font-size:11px}#rows{max-height:220px;overflow:auto;margin-top:10px;border-top:1px solid #dfe6df}.row{padding:8px 2px;border-bottom:1px solid #e2e8e2;overflow-wrap:anywhere;font-size:12px}#download{width:100%;min-height:44px;margin-top:12px;padding:10px 12px;border:0;border-radius:8px;background:#18382d;color:white;font:inherit;font-weight:700;cursor:pointer}#download:hover{background:#245640}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<style>
  body{max-height:580px;overflow:auto}.picker{margin-top:12px;padding:12px;border:1px solid #dfe6df;border-radius:10px;background:#e9efe9}.picker-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.picker-heading .hint{color:#64736a}.group-list{display:grid;gap:2px;max-height:164px;margin:0 0 10px;padding:4px;overflow:auto;border:1px solid #d8e1da;border-radius:8px;background:#fff}.group-option{display:flex;align-items:center;gap:9px;min-height:38px;padding:5px 8px;border-radius:5px;color:#18382d;font-size:12px;cursor:pointer}.group-option:hover{background:#f0f5f0}.group-option input{width:16px;height:16px;accent-color:#187653}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.action:focus-visible,#download:focus-visible,.group-option:focus-within{outline:3px solid #79b89a;outline-offset:2px}
</style>
<main>
  <header>
    <p class="eyebrow">WHATSAPP WEB · LOCAL CSV</p>
    <h1>Export people</h1>
    <p class="intro">Export only details rendered in WhatsApp Web.</p>
  </header>
  <section class="actions" aria-label="Scan options">
    <button id="scan" class="action primary"><span class="step">01 / ONE GROUP</span><strong>Scan open group</strong><span class="hint">Use its open member list.</span></button>
    <button id="loadGroups" class="action"><span class="step">02 / GROUPS</span><strong>Choose groups</strong><span class="hint">Select groups; scan visits each automatically.</span></button>
    <button id="scanContacts" class="action"><span class="step">03 / CHATS</span><strong>Scan visible contacts</strong><span class="hint">No scrolling. Group chat rows may appear.</span></button>
  </section>
  <section id="groupPicker" class="picker" hidden aria-label="Choose groups">
    <div class="picker-heading"><strong>Select groups</strong><span id="groupCount" class="hint"></span></div>
    <fieldset id="groupList" class="group-list"><legend class="sr-only">WhatsApp groups</legend></fieldset>
    <button id="scanSelected" class="action primary" disabled><strong>Scan selected groups</strong><span class="hint">The page switches groups briefly, then returns.</span></button>
  </section>
  <div id="status" role="status" aria-live="polite">Choose a scan to start.</div>
  <div id="preview"></div>
  <button id="download" hidden>Download CSV</button>
</main>
<script src="popup.js"></script>
</html>
